# Publicación en Render (https://render.com): Nuevo → Blueprint → este repositorio.
# Render instala, compila el cliente y arranca el servidor de juego.
# Durante la creación pide la clave del profesor (TEACHER_PIN).
services:
  - type: web
    name: imperios-del-aula
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TEACHER_PIN
        sync: false
